name: check-and-test

on: 
  - push
  - pull_request

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      steps:
      - uses: actions/checkout@v3
      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.111.3'
          extended: true
      - name: setup go
        uses: https://github.com/actions/setup-go@v4
        with:
          go-version: '>=1.20.1'
      - name: Build
        run: |
          make clean
          make build
