    </text>
    <text x="0" y="120" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="132" font-weight="800">
      1.0.0
    </text>

    <g transform="translate(0 156)">
      <rect x="0" y="0" width="250" height="52" rx="26" fill="#173222" stroke="#2d6f42" />
      <circle cx="30" cy="26" r="9" fill="#79c143" />
      <text x="54" y="34" fill="#ebffe1" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">
        Stable Release
      </text>
    </g>

    <text x="0" y="266" fill="#8ea7b7" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">
