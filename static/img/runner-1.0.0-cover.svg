      <circle cx="122" cy="54" r="38" fill="#204f2f" stroke="#4d9760" />
      <path d="M103 53l12 12 25-27" fill="none" stroke="#efffe8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g>
      <circle cx="270" cy="54" r="38" fill="#204f2f" stroke="#4d9760" />
      <path d="M251 53l12 12 25-27" fill="none" stroke="#efffe8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

