<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gitea Runner 1.0.0 cover image</title>
  <desc id="desc">A simplified cover image for Gitea Runner 1.0.0 with large typography and a minimal runner workflow illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b141c" />
      <stop offset="100%" stop-color="#11281a" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101d28" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#0c161f" stop-opacity="0.97" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)" />

  <g opacity="0.12" fill="#79c143">
    <circle cx="1070" cy="110" r="110" />
    <circle cx="120" cy="540" r="120" />
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="84" width="1056" height="462" rx="36" fill="url(#card)" stroke="#23404e" />
  </g>

  <g transform="translate(126 148)">
