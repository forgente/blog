      <rect x="0" y="0" width="246" height="30" rx="28" fill="#173243" />
      <circle cx="24" cy="15" r="5" fill="#ff6b6b" />
      <circle cx="42" cy="15" r="5" fill="#ffd166" />
      <circle cx="60" cy="15" r="5" fill="#79c143" />
      <text x="123" y="83" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700">
